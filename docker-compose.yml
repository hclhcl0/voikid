version: '3.8'

services:
  vocakids:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vocakids
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Điền GEMINI_API_KEY nếu muốn hệ thống dùng key chung cho toàn server:
      # - GEMINI_API_KEY=your_gemini_api_key_here
