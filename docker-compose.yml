version: '3.8'

services:
  vocakids:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Secrets must be supplied as runtime variables in Coolify or the host .env.
      - VOCAKIDS_ADMIN_PASSWORD=${VOCAKIDS_ADMIN_PASSWORD:?Set VOCAKIDS_ADMIN_PASSWORD}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET}
      - VOCAKIDS_DATA_DIR=/app/data
      - VOCAKIDS_CONTENT_DIR=/app/data/backend
      - VOCAKIDS_FAMILY_DIR=/app/data/families
      # Kết nối nội bộ qua mạng Docker tới service postgres
      - DATABASE_URL=postgresql://vocakids:vocakids_secret_password@postgres:5432/vocakids_db
      # - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      - appdata:/app/data

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=vocakids
      - POSTGRES_PASSWORD=vocakids_secret_password
      - POSTGRES_DB=vocakids_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocakids -d vocakids_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  appdata:
    driver: local
  pgdata:
    driver: local
